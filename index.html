<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Littera — Proyectos</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1236"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Littera"><script src="themes.js"></script>
<style>
:root{--bg:#ece9e2;--pn:#fbfaf7;--ln:#ddd8cc;--tx:#2b2a27;--mu:#807b6f;--ac:#8a4b2a;--ah:#f0e3d8}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--pn:#22201e;--ln:#38352f;--tx:#e8e4da;--mu:#9a9588;--ac:#e0a67c;--ah:#3a2e25}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:auto}
button,input{font:inherit;color:var(--tx)}
button{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--ah)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri:hover{filter:brightness(1.1)}
button.lk{border-color:transparent;background:transparent;color:var(--mu);padding:4px 8px}
button.lk:hover{background:var(--ah);color:var(--tx)}
button.dg:hover{color:#b3261e}
input{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 8px}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px}
h1{font:600 34px Georgia,serif;color:var(--ac);margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 28px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.sp{flex:1}
#nw{display:none;gap:8px;margin-bottom:20px;padding:14px;background:var(--pn);border:1px solid var(--ac);border-radius:10px;align-items:center}
#nw.on{display:flex}#nw input{flex:1}
.card{display:flex;align-items:center;gap:12px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:var(--ac);background:var(--ah)}
.ico{font-size:26px}
.inf{flex:1;min-width:0}
.nm{font:600 17px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{color:var(--mu);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;opacity:.0}@media(pointer:coarse){.acts{opacity:1;flex-wrap:wrap}button{min-height:40px}}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.empty{text-align:center;color:var(--mu);padding:50px 0;border:1px dashed var(--ln);border-radius:10px}
#msg{color:#b3261e;min-height:18px;margin-bottom:8px}
.legacy{background:var(--ah);border:1px solid var(--ac);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:none;align-items:center;gap:12px}
</style></head><body>
<div class="wrap">
  <h1><img src="assets/logo.png" alt="" style="width:44px;height:44px;vertical-align:-10px;margin-right:10px">Littera</h1>
  <p class="sub">Tus proyectos de escritura. Se guardan en este dispositivo y, si quieres, se sincronizan con tu OneDrive.</p>
  <div id="legacy" class="legacy"><span class="sp">Se ha encontrado un libro guardado por una versión anterior de la aplicación.</span><button class="pri" id="bLeg">Importar como proyecto</button></div>
  <div class="bar">
    <button class="pri" id="bNew">＋ Nuevo proyecto</button>
    <button id="bSample" title="Un libro corto ya escrito, con personajes, escenarios y lienzo, para explorar Littera">Libro de muestra</button>
    <button id="bOpen">Importar archivo…</button>
    <span class="sp"></span>
    <button id="bDir">☁ OneDrive / SharePoint</button>
  </div>
  <div id="nw"><input id="nwN" type="text" placeholder="Nombre del proyecto (por ejemplo: Mi novela)" maxlength="80"><button class="pri" id="nwOk">Crear</button><button id="nwCa">Cancelar</button></div>
  <div id="msg"></div>
  <div id="list"></div>
</div>
<script src='config.js'></script><script src='sample-book.js'></script><script src='shim.js'></script><script src='onedrive.js'></script>
<script>
const $=s=>document.querySelector(s),P=window.plumaProj;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString('es-ES',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const msg=t=>{$('#msg').textContent=t||''};
async function load(){
  const l=await P.list(), box=$('#list');
  if(!l.length){box.innerHTML='<div class="empty">Todavía no tienes proyectos.<br>Pulsa «Nuevo proyecto» para empezar tu primer libro.</div>';return}
  box.innerHTML='';
  l.forEach(p=>{
    const c=document.createElement('div');c.className='card';c.tabIndex=0;
    c.innerHTML=`<div class="ico">📖</div><div class="inf"><div class="nm">${esc(p.name)}</div><div class="mt">${p.words.toLocaleString('es-ES')} palabras · modificado ${fmt(p.mtime)}${p.author?' · '+esc(p.author):''}</div><div class="mt" title="${esc(p.path)}">${esc(p.dir)}</div></div>
      <div class="acts"><button class="lk" data-a="ren">Renombrar</button><button class="lk" data-a="dup">Duplicar</button><button class="lk" data-a="exp">Exportar</button><button class="lk dg" data-a="del">Quitar</button></div>`;
    c.onclick=e=>{if(e.target.closest('.acts'))return;P.open(p.path)};
    c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c)P.open(p.path)};
    c.querySelectorAll('[data-a]').forEach(b=>b.onclick=async e=>{
      e.stopPropagation();const a=b.dataset.a;msg('');
      if(a==='ren'){
        const nm=c.querySelector('.nm'),i=document.createElement('input');i.value=p.name;i.style.cssText='font:inherit;width:100%';nm.replaceWith(i);i.focus();i.select();
        let done=false;const fin=async ok=>{if(done)return;done=true;if(ok&&i.value.trim()&&i.value.trim()!==p.name){const r=await P.rename(p.path,i.value);if(!r.ok)msg(r.error)}load()};
        i.onclick=ev=>ev.stopPropagation();i.onkeydown=ev=>{if(ev.key==='Enter')fin(true);if(ev.key==='Escape')fin(false)};i.onblur=()=>fin(true);
      }
      if(a==='exp'){await P.export(p.path)}
      if(a==='dup'){const r=await P.duplicate(p.path);if(!r.ok)msg(r.error);load()}
      if(a==='del'&&confirm('¿Quitar «'+p.name+'» de este dispositivo?'+(/^(OneDrive|SharePoint)/.test(p.dir)?'\n\nEl archivo seguirá en tu OneDrive.':'\n\nEsta acción no se puede deshacer; exporta una copia antes si la necesitas.'))){const r=await P.remove(p.path);if(!r.ok)msg(r.error);load()}
    });
    box.appendChild(c);
  });
}
function showNew(){$('#nw').classList.add('on');$('#nwN').focus()}
async function create(){const n=$('#nwN').value.trim();if(!n){$('#nwN').focus();return}const r=await P.create(n);if(r&&!r.ok)msg(r.error||'No se pudo crear el proyecto.')}
$('#bNew').onclick=showNew;
$('#bSample').onclick=async()=>{const r=await P.sample();if(r&&!r.ok)msg(r.error||'No se pudo crear el libro de muestra.')};
$('#nwCa').onclick=()=>{$('#nw').classList.remove('on');$('#nwN').value=''};
$('#nwOk').onclick=create;
$('#nwN').onkeydown=e=>{if(e.key==='Enter')create();if(e.key==='Escape')$('#nwCa').click()};
$('#bOpen').onclick=()=>P.openDialog();
$('#bDir').onclick=()=>P.folder();
if(new URLSearchParams(location.search).get('nuevo'))showNew();
/* Libro guardado por una versión anterior (localStorage) */
try{
  const old=JSON.parse(localStorage.getItem('pluma-v1'));
  if(old&&old.items&&old.items.length>0&&!localStorage.getItem('pluma-imported')){
    $('#legacy').style.display='flex';
    $('#bLeg').onclick=async()=>{const r=await P.importLegacy(old,(old.bk&&old.bk.tit)||'Libro importado');if(r&&r.ok){try{localStorage.setItem('pluma-imported','1')}catch(e){}}else msg((r&&r.error)||'No se pudo importar.')};
  }
}catch(e){}
load();
</script><script src='licgate.js'></script></body></html>
